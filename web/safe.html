<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сейф 250</title>
  <style>
    body { font-family: Arial; background: #111; color: #fff; text-align: center; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(25, 1fr); gap: 4px; max-width: 1000px; margin: 20px auto; }
    .cell { 
      width: 35px; height: 35px; 
      background: #222; border: 2px solid #444; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 14px; cursor: pointer;
    }
    .opened { background: #400; color: #f66; text-decoration: line-through; }
    .win { background: #060; color: #0f0; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔒 СЕЙФ 250</h1>
  <div class="grid" id="grid"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');

    // Тут буде запит до бота (поки що просто приклад)
    // Реально будемо підключати через Telegram WebApp API пізніше

    function createGrid() {
      const grid = document.getElementById('grid');
      for (let i = 1; i <= 250; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = i;
        cell.onclick = () => alert(`Клітинка ${i} відкрита!`);
        grid.appendChild(cell);
      }
    }
    createGrid();
  </script>
</body>
</html>
